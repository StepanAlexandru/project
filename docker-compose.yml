services:
  postgres:
    image: postgres:16-alpine
    container_name: augmented_zoo_db
    restart: always
    environment:
      POSTGRES_USER: zoo_admin
      POSTGRES_PASSWORD: parola_zoo_admin
      POSTGRES_DB: augmented_zoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: